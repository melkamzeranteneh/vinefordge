version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vineforge
      POSTGRES_PASSWORD: vineforge
      POSTGRES_DB: vineforge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  ai-engine:
    build:
      context: .
      dockerfile: ./ai-engine/Dockerfile
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    ports:
      - '8000:8000'

  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - MCP_URL=http://ai-engine:8000
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis
      - ai-engine

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    ports:
      - '5173:5173'
    depends_on:
      - server

volumes:
  postgres_data:
